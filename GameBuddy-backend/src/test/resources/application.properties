# Test-only overrides.

# No log file during tests.
#
# The application writes ECS JSON to logging.file.name so Filebeat can ship it. Under test
# that is pure side effect: every `./gradlew test` would drop a growing gamebuddy.json into
# the source tree, rotate it, and leave the .gz files behind. An empty value is how Boot is
# told there is no log file — the console output is unaffected, so a failing test still
# prints what it always did.
logging.file.name=
