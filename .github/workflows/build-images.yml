# Builds the three images GameBuddy owns and pushes them to GHCR.
#
# Postgres, Redis and Caddy are stock public images and are pulled straight from Docker Hub
# on the server — they are not built here and must not be.
#
# Why CI rather than the server: DEPLOY.md §5 puts the three images at ~7.5 GB combined, and
# the box is a CX23 with a 40 GB disk. Docker's build cache would eat it within a few
# rebuilds. Building here also keeps a 2-vCPU box out of the business of compiling Spring
# Boot and two Python images while it is serving traffic.
name: Build and push images

on:
  push:
    branches: [master]
    # Only rebuild when something that lands in an image actually changed. A README edit
    # should not spend ten minutes of CI and push 7.5 GB of identical layers.
    paths:
      - 'GameBuddy-backend/**'
      - 'GameBuddy-Model/**'
      - 'docker-compose*.yml'
      - '.github/workflows/build-images.yml'
  # Manual runs matter: a deploy sometimes has to be repeated without a code change,
  # and waiting for a no-op commit to trigger CI is a silly way to spend an afternoon.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase, and the GitHub owner is "canngos" — lowercase already, but
  # derive it rather than hard-code so a rename or a fork does not silently push nowhere.
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # One failing image should not cancel the other two — knowing whether the Spring build
      # and the model build are both broken is more useful than finding out one at a time.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: GameBuddy-backend/Dockerfile
            target: ''
          # Both model images come from the same Dockerfile and differ only by stage.
          # `target` is not optional: the Dockerfile's last stage is `retrain`, so building
          # without a target gives you a `model` image that runs the retrain entrypoint and
          # exits 1. docker-compose.yml carries the same warning for the same reason.
          - name: model
            context: ./GameBuddy-Model
            dockerfile: Dockerfile
            target: serve
          - name: model-retrain
            context: ./GameBuddy-Model
            dockerfile: Dockerfile
            target: retrain

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no PAT to create, rotate or leak.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/gamebuddy-${{ matrix.name }}
          # `latest` is what the server pulls day to day; the SHA tag is what makes a
          # rollback possible, because `latest` two deploys ago is not recoverable.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's own cache, so a rebuild that only changes application code reuses the
          # dependency layers instead of re-downloading the JDK and the Python wheels.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
