name: CI

# The per-service workflows under GameBuddy-*/.github/ built each repo in isolation.
# Since the services share the :common module they can no longer build alone, so the
# build moved here, to the root of the Gradle multi-project build.

on:
  push:
    branches: [ "master", "main", "dev-area" ]
  pull_request:
    branches: [ "master", "main", "dev-area" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew build
        env:
          # A throwaway value so any test that boots a full context finds the
          # mandatory property. Never the production secret.
          JWT_SECRET: ci-only-secret-value-at-least-32-bytes-long

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore
