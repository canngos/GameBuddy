# Local SonarQube for `./gradlew sonar`. Analysis only — not part of the app.
#
#   docker compose -f docker-compose.sonar.yml up -d
#   # wait for http://localhost:9000 (admin/admin, it forces a password change)
#   # My Account > Security > Generate Token
#   ./gradlew build sonar -Dsonar.token=<token>
#
# The same server can back SonarLint in the IDE: SonarLint > Connected Mode >
# add connection to http://localhost:9000, bind the project to key `gamebuddy`.

services:
  sonarqube:
    image: sonarqube:community
    container_name: gamebuddy-sonarqube
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:17-alpine
    container_name: gamebuddy-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
