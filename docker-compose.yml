# GameBuddy, locally.
#
#   cp .env.example .env && docker compose up --build
#
# Brings up Postgres, the Python recommender, the backend and the log stack
# (Elasticsearch, Kibana, Filebeat) wired together:
#
#   API      http://localhost:8080/swagger-ui
#   Logs     http://localhost:5601/app/discover      (Kibana)
#   Indices  http://localhost:9200/_cat/indices?v    (Elasticsearch)
#
# The schema is
# created from db/schema-baseline.sql on first start and the backend runs with
# ddl-auto=validate, so this is the same shape as production rather than a convenient
# approximation of it. If an entity and the SQL disagree, the backend refuses to start here,
# which is exactly where you want to find out.
#
# Differences from production, all deliberate and all listed in the README: mail is printed
# instead of sent, Firebase is off, billing is off, and the secrets are throwaway.

name: gamebuddy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gamebuddy}
      POSTGRES_USER: ${DB_USER:-gamebuddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Exposed so you can psql in and inspect what the app did.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory. Numbered so the baseline lands before the
      # upgrades; anything added later needs a number above 02 to run in the right order.
      #
      # Note this only fires on a *fresh* volume. After changing the schema, either add an
      # upgrade script and apply it by hand, or `docker compose down -v` and start over.
      - ./GameBuddy-backend/src/main/resources/db/schema-baseline.sql:/docker-entrypoint-initdb.d/01-baseline.sql:ro
      - ./GameBuddy-backend/src/main/resources/db/seed-local.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # -d and -U matter: without them pg_isready checks the default database and reports
      # healthy while the init scripts are still running, and the backend starts against a
      # schema that does not exist yet.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gamebuddy} -d ${DB_NAME:-gamebuddy}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  model:
    build:
      context: ./GameBuddy-Model
      dockerfile: Dockerfile
    environment:
      # Must match the backend's. A mismatch is not a loud failure: the model answers 503
      # and the feed surfaces a generic "Recommendation service unavailable", which looks
      # like the model being down rather than a wrong secret.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}

      # Where the image classifier draws its two lines. These are a moderation policy
      # expressed as numbers, not a model detail: raising REJECT lets more through and
      # leans on the human queue, lowering it refuses more ordinary photographs. Retune
      # them against what the queue actually receives rather than guessing twice.
      NSFW_REJECT_THRESHOLD: ${NSFW_REJECT_THRESHOLD:-0.85}
      NSFW_APPROVE_THRESHOLD: ${NSFW_APPROVE_THRESHOLD:-0.20}
    ports:
      - "${MODEL_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: GameBuddy-backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      model:
        # Waits for the model to actually load its artefact. Without this the backend comes
        # up first and the first few recommendation requests fail for no visible reason.
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-gamebuddy}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-gamebuddy}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: gamebuddy

      # The schema is owned by SQL. 'validate' means a mismatch stops the application
      # instead of Hibernate quietly reshaping the database underneath you.
      DDL_AUTO: validate

      PREDICT_SERVICE_URL: http://model:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      # Object storage for uploaded avatars. Empty R2_ACCESS_KEY_ID — which is what an
      # unconfigured .env gives — selects the local-disk implementation instead, so the
      # stack comes up and avatars work with no Cloudflare account at all. See
      # StorageConfig.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_UPLOADS_BUCKET: ${R2_UPLOADS_BUCKET:-gamebuddy-uploads}
      R2_MEDIA_BUCKET: ${R2_MEDIA_BUCKET:-gamebuddy-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

      # Only used when the above is empty. Inside the container the media directory has to
      # be a volume or every restart loses the uploads; the host URL is what a phone on the
      # same network can actually reach, which is not "localhost" from the app's side.
      LOCAL_MEDIA_DIR: /app/.media
      LOCAL_MEDIA_URL: ${LOCAL_MEDIA_URL:-http://10.0.2.2:8080/media}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY:?set CHAT_ENCRYPTION_KEY in .env}

      # The single staff account, created on first start only. Empty means "do not create
      # one", which is the right default for anyone else running this stack.
      MODERATOR_EMAIL: ${MODERATOR_EMAIL:-}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-}

      # How long an avatar the classifier was unsure about waits for a human before it
      # publishes itself. See AvatarReviewJob — the queue is meant to be ignorable.
      AVATAR_PUBLISH_AFTER: ${AVATAR_PUBLISH_AFTER:-P3D}

      # Prints verification codes to `docker compose logs backend` instead of sending them.
      # Without this, registration rolls its transaction back when SMTP is unreachable and
      # no account can be created at all.
      MAIL_MODE: log
      # Still required even in log mode: with no host configured Boot creates no
      # JavaMailSender and the application will not start.
      MAIL_HOST: localhost
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

      # Push delivery. On, because the service-account key is now mounted below.
      #
      # FIREBASE_ENABLED=false is still the right setting for anyone without the key:
      # the application fails to start rather than degrading, which is deliberate — a
      # backend that silently swallows every notification is worse than one that refuses
      # to boot and says why.
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-true}
      FIREBASE_CONFIG_PATH: /run/secrets/firebase-service-account.json

      # Lets the Expo web build call the API from a browser. Native builds ignore CORS
      # entirely, so this is only for `npx expo start --web`. Port is a wildcard because
      # Metro moves off 8081 when it is busy; the LAN pattern covers opening the dev
      # server from another machine. Both are development origins — production sets
      # CORS_ALLOWED_ORIGINS to a real domain, or leaves it empty.
      CORS_ALLOWED_ORIGINS: "http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*]"

      # The chat socket checks origins separately from CORS — it is a handshake, not a
      # cross-origin fetch, and Spring guards it with its own list. The default is
      # localhost:3000, which is nobody here. Native clients send no Origin at all and
      # are unaffected; this is for the web build and the Expo dev server.
      WS_ALLOWED_ORIGINS: "http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*]"

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Where the ECS JSON log file is written. Filebeat reads this same file from the
      # shared volume below. The console keeps its human-readable format, so
      # `docker compose logs backend` is unchanged.
      LOG_FILE: /app/logs/gamebuddy.json
      ENVIRONMENT: ${ENVIRONMENT:-local}
    volumes:
      # The Firebase service-account key, read-only.
      #
      # A bind mount rather than an image layer or an environment variable: it is a
      # private key, it must never end up in a built image or in `docker inspect`, and it
      # is git-ignored on the host. FIREBASE_SERVICE_ACCOUNT lets a deployment point at
      # its own copy; the default is the path used locally.
      - ${FIREBASE_SERVICE_ACCOUNT:-./secret/gamebuddy-a4205-firebase-adminsdk-fbsvc-13e51ed01f.json}:/run/secrets/firebase-service-account.json:ro
      # Only used when R2 is not configured — otherwise nothing is written here at
      # all. Named rather than a bind mount so it behaves the same on every host, and
      # present so that running without credentials does not lose every upload on the
      # next `docker compose up`.
      - media-data:/app/.media
      # The log file, shared with Filebeat. A volume rather than a bind mount so the
      # non-root user in the image owns it on every host — a bind mount from Windows
      # arrives root-owned and the JVM silently falls back to console-only logging.
      - backend-logs:/app/logs

    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # --- logging -------------------------------------------------------------------------
  #
  # Elasticsearch stores the logs, Kibana reads them, Filebeat moves them from the
  # backend's log file into Elasticsearch. Nothing in the application talks to any of the
  # three: the backend writes a file and is done, so the search cluster can be stopped,
  # restarted or left out entirely without the API noticing. `docker compose up backend`
  # still brings up only Postgres, the model and the backend.
  #
  # Open http://localhost:5601/app/discover once it is up.

  elasticsearch:
    # All three Elastic images are pinned to the same patch release. Filebeat refuses to
    # index into a cluster newer than itself, so a version skew here is not a subtle
    # degradation — it is a shipper that starts, connects and then drops everything.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    environment:
      # One node, so no master election and no waiting for a quorum that will never form.
      discovery.type: single-node

      # No authentication and no TLS. That is acceptable *here* and nowhere else: this
      # cluster is reachable only from this compose network and from localhost, and the
      # alternative for a local stack is a certificate dance that ends with everyone
      # disabling verification anyway. A deployed cluster turns this on and gets real
      # credentials — see the README.
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic

      # Elasticsearch sizes its heap from the host's memory by default and will happily
      # reserve several gigabytes on a development machine. Half a gigabyte indexes a
      # local application's logs without noticing.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

      # Refuses to start rather than silently disabling the disk-based shard allocator on
      # a nearly-full disk, which is the failure that presents as "indexing stopped and
      # nothing in the logs says why".
      cluster.routing.allocation.disk.threshold_enabled: "true"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      # Exposed so the indices can be queried directly:
      #   curl localhost:9200/gamebuddy-logs-*/_search?pretty
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      # yellow, not green: a single node cannot allocate replica shards, so a
      # perfectly healthy one-node cluster never reaches green and waiting for it
      # would hang the stack forever.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_PORT:-5601}

      # Throwaway keys, and they have to be set: without them Kibana generates new ones on
      # every start, which invalidates saved objects encrypted by the previous run — so a
      # saved search survives a restart only by accident. 32 characters is the minimum.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: gamebuddy-local-dev-kibana-key-01
      XPACK_REPORTING_ENCRYPTIONKEY: gamebuddy-local-dev-kibana-key-02
      XPACK_SECURITY_ENCRYPTIONKEY: gamebuddy-local-dev-kibana-key-03
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:5601/api/status | grep -q '\"level\":\"available\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.4.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Root because it reads a file written by another container's user and a config file
    # mounted from the host. Filebeat has no network exposure and runs no application
    # code, so this is a smaller concession than the alternative — matching uids across
    # three images and hoping the host agrees.
    user: root
    # --strict.perms=false is not optional on Windows or macOS: Filebeat refuses to load a
    # config file that is group- or world-writable, and a bind mount from either host is
    # always 0777 as far as the container is concerned. The check is worth having on
    # Linux; here it only ever produces a false positive.
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # The backend's log file. Read-only — Filebeat has no business writing here.
      - backend-logs:/var/log/gamebuddy:ro
      # The registry: how far into each file Filebeat has read. Without persisting it,
      # every restart re-indexes the whole log directory from the beginning and Kibana
      # fills with duplicates.
      - filebeat-data:/usr/share/filebeat/data
    healthcheck:
      # --strict.perms=false again, for the same reason as the command above: this is a
      # second Filebeat invocation and it reads the same bind-mounted config, so without
      # the flag the healthcheck fails on file permissions while the shipper it is checking
      # is running perfectly.
      test: ["CMD-SHELL", "filebeat test output --strict.perms=false | grep -q 'talk to server... OK'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  # Creates the Kibana data view once, so Discover has something to show the first time it
  # is opened instead of an onboarding wizard. Runs to completion and exits; `docker
  # compose ps` showing it as "exited (0)" is the success case.
  kibana-setup:
    image: curlimages/curl:8.15.0
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        code=$$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
          "http://kibana:5601/api/data_views/data_view" \
          -H 'kbn-xsrf: true' \
          -H 'Content-Type: application/json' \
          -d '{"data_view":{"title":"gamebuddy-logs*","name":"GameBuddy logs","timeFieldName":"@timestamp"}}')
        if [ "$$code" = "200" ]; then
          echo "Kibana data view created"
        # Every run after the first lands here. Note it is a 400, not the 409 you would
        # expect — Kibana reports a duplicate saved object as a bad request — so the status
        # code alone cannot tell "already done" from "genuinely wrong" and the body has to
        # be read. Getting this wrong leaves the service permanently red on a healthy stack.
        elif grep -q "Duplicate data view" /tmp/out; then
          echo "Kibana data view already exists"
        else
          echo "Could not create the Kibana data view (HTTP $$code):"; cat /tmp/out; exit 1
        fi

volumes:
  postgres-data:
  # Only used when R2 is not configured. Named rather than a bind mount so it behaves the
  # same on Windows, macOS and Linux.
  media-data:
  # The backend writes here, Filebeat reads. Shared rather than each holding its own copy
  # so there is exactly one log file and no question of which one is current.
  backend-logs:
  elasticsearch-data:
  # Filebeat's read positions. Losing this volume means re-indexing, not losing logs.
  filebeat-data:
