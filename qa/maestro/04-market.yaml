# The Market, and the paywall behind it.
#
# Money is the part of a product where a UI bug is most expensive, and the coin balance is
# the number a user will notice being wrong. The purchase itself is not driven — the build
# carries a RevenueCat *test store* key (it says so in the log on every launch), so a tap
# on "buy" exercises a simulator, not billing. Entitlement granting is asserted through the
# webhook in the API suite instead, which is the path that actually grants Gold.
#
# The screen is two views behind one header, not one long scroll: Earn and Shop are
# separate segments and **Earn is the default**. Everything to do with cosmetics —
# FRAMES AND BANNERS, the Frames/Banners switch, the coin shop — is mounted only while
# Shop is selected, so it has to be selected before any of it can be asserted.

appId: com.findgamebuddy.app
name: 04 market
---
- runFlow: _login.yaml

# The tab bar labels are title case ("Market"), not the screen's own MARKET overline.
- tapOn: "Market"
- extendedWaitUntil:
    visible: "Show off"
    timeout: 15000

# Gold sits above both segments because it belongs to each: it is bought in Shop and it
# pays a monthly stipend in Earn.
- assertVisible: "GAMEBUDDY GOLD"
- takeScreenshot: artifacts/04-01-market

- assertVisible: "Earn"
- assertVisible: "Shop"

# --- Earn, which is what the screen opens on ---------------------------------------------
- assertVisible: "EARN"
- takeScreenshot: artifacts/04-02-earn

# --- Shop --------------------------------------------------------------------------------
- tapOn: "Shop"
# Scrolled to, because Shop opens on the coin packs and the consumables shelf — cosmetics
# are further down and are off-screen when the tab is selected. Bundles sit above the
# individual shelves, so they are passed on the way there and asserted first.
- scrollUntilVisible:
    element:
      text: "BUNDLES"
    direction: DOWN
    timeout: 20000

- scrollUntilVisible:
    element:
      text: "FRAMES AND BANNERS"
    direction: DOWN
    timeout: 20000
- takeScreenshot: artifacts/04-03-shop

- assertVisible: "Frames"
- assertVisible: "Banners"
# The third kind. Themes are colour rather than artwork, so the row draws a gradient
# swatch where the others draw a picture -- see CosmeticKind.THEME.
- assertVisible: "Themes"

# The shelves themselves render. A free account owns none of the paid items, so this is
# only asserting that the grid draws — what an unaffordable item does is checked below.
- tapOn: "Banners"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/04-04-banners

- tapOn: "Frames"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/04-05-frames

- scroll
- takeScreenshot: artifacts/04-06-shop-scrolled

# Back to Earn, which also proves the segment is a real toggle rather than a one-way trip.
# Scrolled back up first: the segments live under the header, and by this point the screen
# has been scrolled well past them.
#
# Faster and longer than the default since the wave-2 catalogue landed: bundles, five more
# frames and banners and six themes sit between here and the header, and the old speed 40 /
# 20s ran out of time somewhere in the middle of the shelf.
- scrollUntilVisible:
    element:
      text: "Earn"
    direction: UP
    speed: 80
    timeout: 40000
- tapOn: "Earn"
- extendedWaitUntil:
    visible: "EARN"
    timeout: 10000
- takeScreenshot: artifacts/04-07-earn-again
