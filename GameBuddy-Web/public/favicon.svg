<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GameBuddy">
  <!--
    The mark: the "Duo-Grip" — the controller silhouette with two heads peeking up behind
    it, on the app's violet-to-cyan gradient. A gamepad at first glance, couch co-op at the
    second; the double read is the brand in one shape.

    Drawn rather than exported so it stays a few hundred bytes and scales to any tab size.
    The rounded square repeats the app icon's shape, and the stops are the same two colours
    as `gradients.primary.dark` in the app — see GameBuddy-App/src/theme/gradients.ts.

    The D-pad and buttons are "cut out" by painting them with the same gradient as the
    tile: the gradient is userSpaceOnUse over the whole 64-box, so the colours line up
    exactly and the shapes read as holes without needing a mask.
  -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#7C4DFF" />
      <stop offset="1" stop-color="#00E5FF" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)" />
  <!-- The two buddies. -->
  <circle cx="20" cy="17.5" r="5" fill="#FFFFFF" />
  <circle cx="44" cy="17.5" r="5" fill="#FFFFFF" />
  <!-- Controller body. -->
  <path d="M20 25h24a10 10 0 0 1 9.6 12.8l-2.4 8A6 6 0 0 1 40 47l-3-4H27l-3 4a6 6 0 0 1-10.8-1.2l-2.4-8A10 10 0 0 1 20 25Z" fill="#FFFFFF" />
  <!-- D-pad and buttons, knocked out in the tile gradient. -->
  <path d="M21 32.5v7M17.5 36h7" fill="none" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="43" cy="34" r="1.9" fill="url(#g)" />
  <circle cx="47" cy="38" r="1.9" fill="url(#g)" />
</svg>
